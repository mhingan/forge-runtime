name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime, toolkit and test dependencies
        run: python -m pip install -e ".[dev,api]"
      - name: Lint and import normalization
        run: |
          ruff check . --fix
          ruff check .
      - name: Test
        run: pytest --cov=forge_runtime --cov-report=term-missing

  sandbox-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Forge Runtime
        run: python -m pip install -e ".[dev,api]"
      - name: Build disposable agent toolchain image
        run: forge sandbox build
      - name: Verify Docker image and daemon
        run: forge sandbox check
      - name: Verify internet access inside sandbox
        run: forge sandbox run -- curl --fail --silent --show-error --max-time 15 -I https://pypi.org
      - name: Run complete suite inside sandbox
        run: forge sandbox run -- bash -lc "PYTHONPATH=src python -m pytest -q"
      - name: Lint inside sandbox
        run: forge sandbox run -- ruff check src tests
      - name: Verify read-write sandbox changes are applied
        run: |
          forge sandbox run --read-write -- python -c "from pathlib import Path; Path('.forge-sandbox-write-check').write_text('ok', encoding='utf-8')"
          test "$(cat .forge-sandbox-write-check)" = "ok"
          rm .forge-sandbox-write-check
      - name: Verify read-only sandbox changes are discarded
        run: |
          forge sandbox run -- python -c "from pathlib import Path; Path('.forge-sandbox-readonly-check').write_text('must-not-escape', encoding='utf-8')"
          test ! -e .forge-sandbox-readonly-check

  package:
    name: Build PyPI distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Verify bundled sandbox Dockerfile
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          wheels = glob.glob("dist/*.whl")
          sdists = glob.glob("dist/*.tar.gz")
          assert len(wheels) == 1, f"Expected one wheel, found {wheels}"
          assert len(sdists) == 1, f"Expected one sdist, found {sdists}"
          with zipfile.ZipFile(wheels[0]) as wheel:
              assert "forge_runtime/sandbox_assets/Dockerfile" in wheel.namelist()
          with tarfile.open(sdists[0], "r:gz") as sdist:
              assert any(
                  name.endswith("/src/forge_runtime/sandbox_assets/Dockerfile")
                  for name in sdist.getnames()
              )
          print("Wheel and sdist both contain the sandbox Dockerfile.")
          PY
