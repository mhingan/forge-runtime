name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime, toolkit and test dependencies
        run: python -m pip install -e ".[dev,api]"
      - name: Lint and import normalization
        run: |
          ruff check . --fix
          ruff check .
      - name: Test
        run: pytest --cov=forge_runtime --cov-report=term-missing

  sandbox-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Forge Runtime
        run: python -m pip install -e ".[dev,api]"
      - name: Build disposable agent toolchain image
        run: forge sandbox build
      - name: Verify Docker image and daemon
        run: forge sandbox check
      - name: Verify internet access inside sandbox\n        run: forge sandbox run -- curl --fail --silent --show-error --max-time 15 -I https://pypi.org\n      - name: Run complete suite inside sandbox
        run: forge sandbox run -- bash -lc "PYTHONPATH=src python -m pytest -q"
      - name: Lint inside sandbox
        run: forge sandbox run -- ruff check src tests
      - name: Verify read-write sandbox changes are applied
        run: |
          forge sandbox run --read-write -- python -c "from pathlib import Path; Path('.forge-sandbox-write-check').write_text('ok', encoding='utf-8')"
          test "$(cat .forge-sandbox-write-check)" = "ok"
          rm .forge-sandbox-write-check
      - name: Verify read-only sandbox changes are discarded
        run: |
          forge sandbox run -- python -c "from pathlib import Path; Path('.forge-sandbox-readonly-check').write_text('must-not-escape', encoding='utf-8')"
          test ! -e .forge-sandbox-readonly-check
