name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(
                  f"Release tag {actual!r} does not match package version {expected!r}."
              )
          print(f"Preparing forge-agent-runtime {version}")
          PY
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine
      - name: Check initial PyPI project name availability
        if: github.event.release.tag_name == 'v0.1.0'
        run: |
          python - <<'PY'
          import urllib.error
          import urllib.request

          url = "https://pypi.org/pypi/forge-agent-runtime/json"
          try:
              with urllib.request.urlopen(url, timeout=15) as response:
                  if response.status == 200:
                      raise SystemExit(
                          "forge-agent-runtime is already registered on PyPI. "
                          "Choose a different distribution name before publishing."
                      )
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
          print("forge-agent-runtime is not currently registered on PyPI.")
          PY
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Verify bundled sandbox Dockerfile
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          wheels = glob.glob("dist/*.whl")
          sdists = glob.glob("dist/*.tar.gz")
          assert len(wheels) == 1, f"Expected one wheel, found {wheels}"
          assert len(sdists) == 1, f"Expected one sdist, found {sdists}"

          with zipfile.ZipFile(wheels[0]) as wheel:
              assert "forge_runtime/sandbox_assets/Dockerfile" in wheel.namelist()

          with tarfile.open(sdists[0], "r:gz") as sdist:
              assert any(
                  name.endswith("/src/forge_runtime/sandbox_assets/Dockerfile")
                  for name in sdist.getnames()
              )
          print("Wheel and sdist both contain the sandbox Dockerfile.")
          PY
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/forge-agent-runtime
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
