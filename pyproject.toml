[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "forge-runtime"
version = "0.1.0"
description = "Provider-neutral orchestration runtime for multi-agent workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "agentforge-toolkit==1.1.0",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "httpx>=0.27,<1",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
]

[project.optional-dependencies]
openai = ["openai>=1.30,<3"]
anthropic = ["anthropic>=0.28,<1"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<2",
  "pytest-cov>=5,<8",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
forge = "forge_runtime.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_runtime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
