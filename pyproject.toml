[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "forge-agent-runtime"
version = "0.3.0"
description = "Docker-isolated multi-agent orchestration runtime for the AgentForge ecosystem"
keywords = ["multi-agent", "agents", "orchestration", "agentforge", "llm", "coding-agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
readme = "README.md"
authors = [{ name = "Mihaita Hingan" }]
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "agentforge-toolkit>=1.2.1,<2",
  "forge-mcp>=0.2.0,<1",
  "mcp>=1.30,<2",
  "keyring>=25,<27",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "httpx>=0.27,<1",
  "uv>=0.5,<1",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
]

[project.urls]
Homepage = "https://github.com/mhingan/forge-runtime"
Repository = "https://github.com/mhingan/forge-runtime"
Issues = "https://github.com/mhingan/forge-runtime/issues"

[project.optional-dependencies]
openai = ["openai>=1.30,<3"]
anthropic = ["anthropic>=0.28,<1"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<2",
  "pytest-cov>=5,<8",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
forge = "forge_runtime.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_runtime"]
force-include = { "src/forge_runtime/sandbox_assets/Dockerfile" = "forge_runtime/sandbox_assets/Dockerfile" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
